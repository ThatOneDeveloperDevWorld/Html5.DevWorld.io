<!DOCTYPE html>
<html>
<head>
<title>Dev World - Profile Layout</title>
<style>
body {
    background-color: #111111;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
}

/* Simulating the mobile screen layout from the video */
.phone-screen {
    width: 360px;
    height: 640px;
    background-color: #eaf4f9; /* Classic light blue retro editor background */
    color: #222222;
    border-radius: 20px;
    border: 4px solid #333333;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    overflow: hidden;
}

/* Top Profile Header Area */
.profile-header {
    background-color: #ffffff;
    padding: 15px;
    border-bottom: 2px solid #dddddd;
    display: flex;
    align-items: center;
    gap: 15px;
}

.pfp-box {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    overflow: hidden;
    background-color: #55ff55;
    border: 2px solid #222222;
    flex-shrink: 0;
}

.pfp-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    mix-blend-mode: multiply;
}

.user-details h2 {
    margin: 0;
    font-size: 18px;
    font-weight: bold;
}

.stats-row {
    font-size: 12px;
    color: #666666;
    margin-top: 5px;
    display: flex;
    gap: 10px;
}

/* Content Area (Games list) */
.content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.game-card {
    background-color: #ffffff;
    border: 2px solid #cccccc;
    border-radius: 10px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.game-thumbnail {
    width: 50px;
    height: 50px;
    background-color: #22a2ff;
    border-radius: 6px;
    border: 2px solid #222222;
}

/* Bottom Navigation Bar */
.bottom-nav {
    height: 60px;
    background-color: #ffffff;
    border-top: 2px solid #dddddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.nav-item {
    font-size: 11px;
    color: #777777;
    text-align: center;
    cursor: pointer;
}

.nav-item.active {
    color: #22a2ff;
    font-weight: bold;
}

.center-create-tab {
    width: 40px;
    height: 40px;
    background-color: #55ff55;
    border: 2px solid #228822;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    color: #1a1a1a;
    font-weight: bold;
    box-shadow: 0 3px 0 #228822;
}
</style>
</head>
<body>

<div class="phone-screen">
    <div class="profile-header">
        <div class="pfp-box" id="pfpWrapper" style="background-color: #55ff55;">
            <img src="profiledefres.png" alt="PFP" class="pfp-img">
        </div>
        <div class="user-details">
            <h2 id="usernameDisplay">Loading...</h2>
            <div class="stats-row">
                <span>0 Follow</span>
                <span>0 Fans</span>
                <span>0 Favorite</span>
            </div>
        </div>
    </div>

    <div class="content-scroll">
        <div class="game-card">
            <div class="game-thumbnail"></div>
            <div>
                <strong>My First Game</strong>
                <p style="margin: 4px 0 0 0; font-size: 12px; color: #888;">Published 2 days ago</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">Games</div>
        <div class="center-create-tab">+</div>
        <div class="nav-item">Message</div>
        <div class="nav-item" onclick="window.location.href='profile.html'">My</div>
    </div>
</div>

<script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
        authDomain: "dev-world-c65f5.firebaseapp.com",
        projectId: "dev-world-c65f5",
        storageBucket: "dev-world-c65f5.firebasestorage.app",
        messagingSenderId: "961103609829",
        appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
    };

    let app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Fetch user and check Firestore database for their custom chosen username
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            try {
                // Reference the 'users' collection using the user's Google UID as the document ID
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().username) {
                    // Display the custom username fetched from the database collection
                    document.getElementById("usernameDisplay").innerText = docSnap.data().username;
                } else {
                    // Fallback to Google display name if no custom username exists in DB yet
                    document.getElementById("usernameDisplay").innerText = user.displayName || "Dev World User";
                }
            } catch (error) {
                console.error("Error fetching username from database:", error);
                document.getElementById("usernameDisplay").innerText = user.displayName || "Dev World User";
            }
        } else {
            // Send back to login if session is not active
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
