<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Explore Games</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #121212; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        header {
            width: 100%; max-width: 800px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 25px;
        }

        .logo { font-size: 22px; font-weight: 900; color: #2ec4b6; }
        .create-btn {
            background: #ff0055; color: #fff; border: none; padding: 10px 16px;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none;
        }

        .games-grid {
            width: 100%; max-width: 800px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px;
        }

        .game-card {
            background: #1f1f1f; border: 2px solid #333; border-radius: 12px;
            padding: 15px; display: flex; flex-direction: column; gap: 8px; transition: transform 0.2s;
        }

        .game-card:hover { transform: translateY(-3px); border-color: #2ec4b6; }
        .game-title { font-size: 18px; font-weight: bold; margin: 0; }
        .game-desc { font-size: 12px; color: #aaa; margin: 0; flex-grow: 1; }
        .play-card-btn {
            background: #2ec4b6; color: #fff; border: none; padding: 8px;
            border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Dev World</div>
        <a href="studio.html" class="create-btn">+ Create Game</a>
    </header>

    <h2 style="width: 100%; max-width: 800px; margin-bottom: 15px;">Community Creations</h2>
    <div id="games-list" class="games-grid">
        <p style="color: #666;">Loading creations...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("games").get().then((snapshot) => {
            const container = document.getElementById("games-list");
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = "<p>No games published yet. Be the first!</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const game = doc.data();
                const card = document.createElement("div");
                card.className = "game-card";
                card.innerHTML = `
                    <h3 class="game-title">${game.title || 'Untitled Game'}</h3>
                    <p class="game-desc">${game.description || 'No description provided.'}</p>
                    <a href="gameplayer.html?gameId=${doc.id}" class="play-card-btn">▶ Play Game</a>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
  </html>
