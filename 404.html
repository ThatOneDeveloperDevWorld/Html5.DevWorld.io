<!DOCTYPE html>
<html>
<head>
<title>Dev World - Page Not Found</title>
<style>
body {
    background-color: #1a1a1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
}

.error-container {
    max-width: 400px;
    padding: 20px;
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
    color: #ff9999;
}

p {
    color: #cccccc;
    margin-bottom: 20px;
}

/* Styled to match your mint-green arcade button */
.btn {
    display: inline-block;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    color: #1a1a1a;
    background-color: #55ff55;
    border: 3px solid #33bb33;
    border-radius: 6px;
    text-decoration: none;
    box-shadow: 0 4px 0 #228822;
    transition: background-color 0.2s ease;
}

.btn:hover {
    background-color: #59fe17;
}
</style>
</head>
<body>

<div class="error-container">
    <h1>404</h1>
    <p>Page not found</p>
    <a href="index.html" class="btn">Back</a>
</div>

</body>
</html>
