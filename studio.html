<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian's Editor - Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .studio-header {
            background: #252526;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .back-btn {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
        }

        .publish-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Controls Area */
        .controls-bar {
            background: #2d2d30;
            padding: 10px 16px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-group input[type="number"] {
            width: 55px;
            background: #1e1e1e;
            border: 1px solid #555;
            color: white;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }

        .control-group input[type="color"] {
            border: none;
            width: 26px;
            height: 26px;
            background: none;
            cursor: pointer;
        }

        .apply-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Workspace Grid Area */
        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 20px;
        }

        #grid-container {
            display: grid;
            gap: 1px;
            background: #444;
            border: 2px solid #555;
        }

        .grid-cell {
            background-color: #ffffff;
            cursor: pointer;
            user-select: none;
        }

        /* Palette / Block Selector Bar */
        .palette-bar {
            background: #252526;
            padding: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 1px solid #333;
        }

        .block-option {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .block-option.selected {
            border-color: #f1c40f;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="studio-header">
        <a href="home.html" class="back-btn">&larr; Exit</a>
        <div class="title">Studio Editor</div>
        <button class="publish-btn" onclick="publishGame()">Publish</button>
    </div>

    <div class="controls-bar">
        <div class="control-group">
            <label>Size (8-86):</label>
            <input type="number" id="grid-size" value="16" min="8" max="86">
            <button class="apply-btn" onclick="resizeGrid()">Apply</button>
        </div>
        <div class="control-group">
            <label>Background:</label>
            <input type="color" id="bg-color" value="#ffffff" onchange="changeBackground()">
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div id="grid-container"></div>
    </div>

    <div class="palette-bar">
        <div class="block-option selected" style="background: #ffffff;" onclick="selectBlock('#ffffff', this)" title="Eraser / White"></div>
        <div class="block-option" style="background: #e74c3c;" onclick="selectBlock('#e74c3c', this)" title="Red Brick"></div>
        <div class="block-option" style="background: #f1c40f;" onclick="selectBlock('#f1c40f', this)" title="Gold Block"></div>
        <div class="block-option" style="background: #2ecc71;" onclick="selectBlock('#2ecc71', this)" title="Grass Block"></div>
        <div class="block-option" style="background: #3498db;" onclick="selectBlock('#3498db', this)" title="Water Block"></div>
        <div class="block-option" style="background: #34495e;" onclick="selectBlock('#34495e', this)" title="Stone Block"></div>
    </div>

    <script>
        let currentSize = 16;
        let currentColor = "#ffffff";
        let isDrawing = false;

        function selectBlock(color, element) {
            document.querySelectorAll('.block-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            currentColor = color;
        }

        function resizeGrid() {
            let inputSize = parseInt(document.getElementById('grid-size').value);
            if (isNaN(inputSize) || inputSize < 8) inputSize = 8;
            if (inputSize > 86) inputSize = 86;
            document.getElementById('grid-size').value = inputSize;
            currentSize = inputSize;
            buildGrid();
        }

        function buildGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${currentSize}, minmax(0, 1fr))`;
            
            // Limit cell dimensions to keep it contained nicely inside workspace
            let cellSize = Math.floor(400 / currentSize);
            if (cellSize < 6) cellSize = 6;

            for (let i = 0; i < currentSize * currentSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.style.width = `${cellSize}px`;
                cell.style.height = `${cellSize}px`;

                cell.addEventListener('mousedown', () => {
                    isDrawing = true;
                    cell.style.backgroundColor = currentColor;
                });
                cell.addEventListener('mouseover', () => {
                    if (isDrawing) {
                        cell.style.backgroundColor = currentColor;
                    }
                });

                container.appendChild(cell);
            }
        }

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        function changeBackground() {
            const bg = document.getElementById('bg-color').value;
            document.getElementById('workspace').style.backgroundColor = bg;
        }

        function publishGame() {
            alert('Your game was published successfully from the Studio!');
            window.location.href = 'home.html';
        }

        // Initialize default grid on load
        buildGrid();
    </script>
</body>
    </html>
