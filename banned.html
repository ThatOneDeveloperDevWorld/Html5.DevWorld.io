<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dev World - Account Banned</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .banned-card {
            background: #1a1a1a;
            border: 2px solid #ff0055;
            border-radius: 16px;
            padding: 35px 25px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .banned-icon {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.4));
        }

        .banned-title {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .banned-text {
            margin: 0;
            font-size: 13px;
            color: #aaaaaa;
            line-height: 1.6;
        }

        .user-info {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11px;
            color: #ff0055;
            word-break: break-all;
            width: 100%;
        }

        .banned-btn {
            margin-top: 5px;
            width: 100%;
            padding: 12px;
            background: #ff0055;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .banned-btn:active {
            background: #d00045;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="banned-card">
        <img src="bannedwarning.png" alt="Warning Icon" class="banned-icon" onerror="this.onerror=null; this.src='https://via.placeholder.com/90/ff0055/ffffff?text=!';">

        <h1 class="banned-title">Account Suspended</h1>
        
        <p class="banned-text">
            Your Dev World account has been restricted due to violations of our community guidelines or Terms of Service.
        </p>

        <div id="user-info" class="user-info">
            Checking account details...
        </div>

        <button id="logout-btn" class="banned-btn">
            Log Out & Return
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged((user) => {
            if (user) {
                // Verify ban status in Firestore
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        // If user is actually NOT banned, send them back to home
                        if (data.isBanned !== 1 && data.isBanned !== true) {
                            window.location.href = "home.html";
                            return;
                        }
                    }
                    document.getElementById("user-info").innerText = "Account: " + (user.email || user.uid);
                }).catch(() => {
                    document.getElementById("user-info").innerText = "Account: " + (user.email || user.uid);
                });
            } else {
                // If not logged in at all, send back to login
                window.location.href = "index.html";
            }
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
  </html>
