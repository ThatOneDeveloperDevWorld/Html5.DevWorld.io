<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dev World - Account Banned</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #4de0e8; /* Matches profile background */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Bold Pop-Art Container Card */
        .banned-card {
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            /* Hard Black Drop-Shadow Matching Profile Card */
            box-shadow: 8px 8px 0px #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .banned-logo {
            width: 130px;
            height: auto;
            object-fit: contain;
        }

        .banned-title {
            margin: 5px 0 0 0;
            font-size: 22px;
            color: #000000;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .banned-text-box {
            background: #f4f4f4;
            border: 2px solid #000000;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #333333;
            line-height: 1.5;
            font-weight: 600;
            width: 100%;
        }

        .user-id-box {
            background: #e0e0e0;
            border: 2px dashed #000000;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            color: #222222;
            word-break: break-all;
            width: 100%;
            font-family: monospace;
            font-weight: bold;
        }

        /* Bold Action Button */
        .banned-btn {
            margin-top: 8px;
            width: 100%;
            padding: 14px;
            background: #ff5555;
            color: #ffffff;
            border: 3px solid #000000;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .banned-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #000000;
        }
    </style>
</head>
<body>

    <div class="banned-card">
        <img src="logo.png" alt="Dev World Beta" class="banned-logo" onerror="this.onerror=null; this.src='bannedwarning.png';">

        <h1 class="banned-title">Account Suspended</h1>
        
        <div class="banned-text-box">
            Your Dev World account has been restricted for violating our community guidelines.
        </div>

        <div id="user-info" class="user-id-box">
            Checking ID...
        </div>

        <button id="logout-btn" class="banned-btn">
            Log Out
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged((user) => {
            if (user) {
                // Verify ban status in Firestore
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        // If user is NOT banned, redirect to home
                        if (data.isBanned !== 1 && data.isBanned !== true) {
                            window.location.href = "home.html";
                            return;
                        }
                    }
                    document.getElementById("user-info").innerText = "ID: " + user.uid;
                }).catch(() => {
                    document.getElementById("user-info").innerText = "ID: " + user.uid;
                });
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
